<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CourseReady — Debug</title>
  <style>
    body { font-family: monospace; background: #0b1f4a; color: #fff; padding: 32px; }
    h2 { color: #f5c842; margin-bottom: 16px; }
    .section { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
    .label { color: #8898bb; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 6px; }
    .val { font-size: 0.9rem; word-break: break-all; }
    .ok  { color: #4ade80; }
    .err { color: #f87171; }
    .warn{ color: #f5c842; }
    button { background: #f5c842; color: #0b1f4a; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  </style>
</head>
<body>

<h2>🔍 CourseReady Debug</h2>

<div class="section">
  <div class="label">Current URL</div>
  <div class="val" id="url"></div>
  <div class="label" style="margin-top:12px">URL Hash</div>
  <div class="val" id="hash"></div>
  <div class="label" style="margin-top:12px">Query Params</div>
  <div class="val" id="query"></div>
</div>

<div class="section">
  <div class="label">localStorage: cr_user</div>
  <div class="val" id="ls"></div>
</div>

<div class="section">
  <div class="label">Cookie: cr_user</div>
  <div class="val" id="cookie"></div>
</div>

<div class="section">
  <div class="label">API: /api/auth?action=url</div>
  <div class="val" id="api-url">Loading…</div>
</div>

<div class="section">
  <div class="label">Actions</div>
  <button onclick="clearSession()">Clear localStorage + Cookie</button>
  <button onclick="testCallback()" style="margin-left:8px">Manually hit /api/callback</button>
</div>

<script>
  document.getElementById('url').textContent = window.location.href;

  const hash = window.location.hash;
  document.getElementById('hash').innerHTML = hash
    ? `<span class="ok">${hash.slice(0, 80)}${hash.length > 80 ? '…' : ''}</span>`
    : `<span class="err">empty</span>`;

  const query = window.location.search;
  document.getElementById('query').innerHTML = query
    ? `<span class="warn">${query}</span>`
    : `<span class="err">empty</span>`;

  const ls = localStorage.getItem('cr_user');
  document.getElementById('ls').innerHTML = ls
    ? `<span class="ok">${ls.slice(0, 200)}</span>`
    : `<span class="err">null — not set</span>`;

  const cookieMatch = document.cookie.match(/cr_user=([^;]+)/);
  document.getElementById('cookie').innerHTML = cookieMatch
    ? `<span class="ok">${cookieMatch[1].slice(0, 100)}</span>`
    : `<span class="err">null — not set</span>`;

  fetch('/api/auth?action=url')
    .then(r => r.json())
    .then(d => {
      document.getElementById('api-url').innerHTML = d.url
        ? `<span class="ok">✓ Got URL: ${d.url.slice(0, 80)}…</span>`
        : `<span class="err">✗ No URL in response: ${JSON.stringify(d)}</span>`;
    })
    .catch(e => {
      document.getElementById('api-url').innerHTML = `<span class="err">✗ Fetch failed: ${e.message}</span>`;
    });

  function clearSession() {
    localStorage.removeItem('cr_user');
    document.cookie = 'cr_user=; Max-Age=0; Path=/';
    location.reload();
  }

  function testCallback() {
    window.location.href = '/api/callback';
  }
</script>
</body>
</html>
